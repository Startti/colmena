version: '3.8'

services:
  colmena-engine:
    build: .
    environment:
      - DATABASE_URL=postgres://colmena_user:colmena_pass@postgres:5432/colmena_db
      - SECURE_VALUES_KEY=${SECURE_VALUES_KEY} # Provided by .env
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./graphs:/app/graphs # Store your JSON DAGs here
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=colmena_user
      - POSTGRES_PASSWORD=colmena_pass
      - POSTGRES_DB=colmena_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colmena_user -d colmena_db"]
      interval: 5s
      timeout: 5s
      retries: 5
