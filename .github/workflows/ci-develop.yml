name: CI - Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Show Rust version
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Hexagonal compliance — documents module
        run: ./scripts/check_hexagonal_documents.sh

      - name: Clean target/wheels
        run: rm -rf target/wheels

      - name: Build Python package
        run: maturin build --release --interpreter python${{ matrix.python-version }} --manifest-path src/libs/colmena/Cargo.toml

      - name: Install Python package
        run: pip install target/wheels/colmena_ai-*-cp$(echo "${{ matrix.python-version }}" | tr -d '.')-*.whl

      - name: Install Python dev dependencies
        run: pip install pytest pytest-asyncio python-dotenv

      - name: Run Python tests
        run: pytest python/ -v || echo "No Python tests found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Node bindings + TS facade
        run: |
          npm ci
          npm run build:debug

      - name: Run Node tests
        run: npm test
