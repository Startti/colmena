name: CI

# Pruebas de cada rama de ambiente y de las PRs hacia ellas. Publicar lo hace
# publish-crate.yml (GitHub Packages, privado). Solo Rust: los bindings de
# Python y Node no los consume nadie, así que no se compilan ni se publican
# (ya no van a PyPI ni a npm).
on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Show Rust version
        run: rustc --version && cargo --version && cargo clippy --version

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Hexagonal compliance — documents module
        run: ./scripts/check_hexagonal_documents.sh

      - name: Docs count drift guard
        run: ./scripts/check_doc_counts.sh

      - name: Crate version calculator
        run: bash scripts/crate_version.test.sh

      # Lo que publica publish-crate.yml tiene que compilar SOLO, fuera del repo:
      # un include_str! hacia docs/ u otro archivo fuera del crate no viaja en
      # el paquete y rompe el build de ADP (pasó con 0.31.2-beta.1).
      - name: Package crate (verified)
        run: cargo package -p colmena_dag_engine --allow-dirty
