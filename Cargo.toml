[package]
name = "colmena"
version = "0.1.0"
edition = "2021"

[lib]
name = "colmena"
crate-type = ["cdylib"]

[[bin]]
name = "colmena"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Python bindings
pyo3 = { version = "0.19", features = ["extension-module"] }

# Streaming
futures = "0.3"
tokio-stream = { version = "0.1", features = ["io-util"] }

# Environment variables
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
mockall = "0.11"
wiremock = "0.5"
serde_json = "1.0"
