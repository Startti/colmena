load_skill:
  summary: Load a markdown skill bundle into the conversation; reveals built-in or user-provided guidance on demand
  description: |
    Load a knowledge skill on demand. Call BEFORE responding when relevant. Pass `reference` to load a specific sub-document listed in a skill's index.

    Skills:

load_attachment:
  summary: Materialize a registered attachment's content (with auto-summary for large files) into the conversation
  description: "Load a document that has been attached to this conversation. Use this when you need to inspect the contents of a previously uploaded file. Each load attempt is a separate call; pass exactly one document_id per call.\n\n"

recall_history:
  summary: Re-read the original content of one past message by its turn index
  description: |
    Re-read the FULL original content of one past message by its turn index (the
    [T<n>] shown in the Conversation summary earlier in your context). The result
    is returned in bounded pages: each call gives `content` plus `offset`,
    `returned_chars`, `total_chars`, and `next_offset`. If `next_offset` is not
    null, call again with `offset` set to that value to read the next page, until
    `next_offset` is null. Use this to reconstruct large artifacts (e.g. a graph
    JSON) verbatim. Call sparingly — each page re-loads content into your context.
