gsheets_create_spreadsheet:
  summary: Create a new Google Sheets workbook (prefer asking the user to share an existing one instead)
  description: |
    Create a new empty Google Spreadsheet with the given title. Returns {spreadsheet_id, url} you can use in subsequent calls.

    PREFER SHARING OVER CREATING: a spreadsheet you create here lives in the AGENT account, not the user's Drive — the user does not own it and may not even see it unless you share it back. Default to asking the user to share an EXISTING spreadsheet with the agent (as Editor) instead. Use this tool only when the user explicitly wants a brand-new sheet or has nothing to share, and tell them the file will live in the agent account.

gsheets_create_from_xlsx:
  summary: Upload a local .xlsx attachment and convert it into a new Google Sheet
  description: |
    Upload an .xlsx attachment as a NATIVE Google Spreadsheet (auto-conversion via Drive API). attachment_id refers to a file already present in the run's attachment store. Returns {spreadsheet_id, url, sheets[]} with the converted tabs.

gsheets_export_xlsx:
  summary: Download an existing Google Sheet as .xlsx bytes attachment
  description: |
    Download a Google Spreadsheet as .xlsx and register it as an attachment. Returns {attachment_id}.

gsheets_list_sheets:
  summary: List every tab (sheet) inside a spreadsheet by ID
  description: |
    List the tabs (sheets) inside a Google Spreadsheet. Returns {sheets: [{sheet_id, title, index, row_count, col_count}]}.

gsheets_add_sheet:
  summary: Create a new tab inside an existing spreadsheet
  description: |
    Add a new tab (sheet) to an existing Google Spreadsheet. Returns {sheet_id, title}.

gsheets_delete_sheet:
  summary: Permanently delete a tab from a spreadsheet
  description: |
    Delete a tab from a Google Spreadsheet. `sheet` accepts either the human title or a stringified numeric sheet_id.

gsheets_read:
  summary: Read a cell range from a tab; supports formatted, unformatted, and formula render modes
  description: |
    Read a sheet and return it as a MARKDOWN TABLE (default) — ideal for reading or
    showing a table. To read a whole sheet, OMIT `range` (reads the entire used
    area); pass an A1 `range` only for a subset. The result includes `dimensions`
    {rows, columns} (the data extent) and the A1 `range`, so you can then read a
    precise subrange. For structured data (further processing) pass
    `format: "json"` to get the raw `values` array. NOTE: to COMPARE or cross-
    reference tables, do NOT read-and-eyeball — use `gsheets_run_python` (code).
    `gsheets_list_sheets` gives a rough allocated grid size (not the data extent)
    if you want to gauge a sheet before reading something large.

    MERGED CELLS: merged cells are auto-expanded on read — every cell of a merge
    returns the merge's value (the top-left anchor), not a blank. Repeated values
    down a column or across a row may therefore reflect a merged region, not
    duplicated data.

gsheets_set_cell:
  summary: Write one value or formula into a single cell
  description: |
    Write a single cell. Strings starting with `=` are evaluated by Google as formulas (USER_ENTERED valueInputOption). Cascading recalc happens server-side automatically.

gsheets_set_range:
  summary: Write a 2-D values array starting at a given address
  description: |
    Bulk-write a rectangular block of cells starting at start_addr. values_2d is a row-major 2D array. Strings starting with `=` are evaluated by Google as formulas.

gsheets_run_python:
  summary: Run sandboxed pandas analysis over sheet ranges loaded directly by the dispatcher (rows never pass through the LLM)
  description: |
    Run sandboxed pandas (pd), numpy (np), scipy.stats over one or more tables.

    ⚠️ KNOW THE COLUMNS FIRST. Binding a sheet loads its ROWS for computation — it
    does NOT tell you the schema. If you don't already know the table's real column
    names and what each column holds, read it FIRST with `gsheets_read`. Never guess
    column names or what a term means (e.g. "frutas" is almost certainly a value in
    a `Categoria` column, not part of the product name). Guessing silently produces
    wrong results — a filter that matches 0 rows, or the wrong rows, with no error.

    ⚠️ SANITY-CHECK THE ROW COUNT. If a filter/groupby/mask matches 0 rows (or far
    fewer than you expected), do NOT report success — that is a signal you
    misunderstood the data. Read the table, find the right column/value, and redo it.

    USE THIS TO COMPARE / cross-reference / dedupe / diff tables — load each table
    as a binding and compute in code; do NOT compare values by eye.

    A binding is either a SHEET source ({var, spreadsheet_id, sheet, range?}) or an
    INLINE source ({var, data: [...]}). Inline `data` is an array of {col: val}
    objects (or a 2-D array with a header row) — use it to pass a table you produced,
    e.g. one you extracted from an image. Each binding becomes a Python list of dicts
    under `var`; do `df = pd.DataFrame(var)`.

    Recipe — image vs sheet: extract the table from the image yourself, pass it as an
    inline `data` binding, pass the sheet as a sheet binding, then compare with
    pandas — normalize names/units and compare numbers WITH A TOLERANCE (e.g.
    abs(a-b) <= 0.5, or within ±5%). Recipe — sheet vs sheet: two sheet bindings →
    df_a.merge(df_b, on=key) or df_a.compare(df_b). Define `output` as a small
    summary; for large diffs write rows back via `output_sheets` (rows never return
    through the model).

    ## Multi-sheet write-back (large results stay out of the LLM)

    To write multiple result tables as new tabs, assign a Python dict `output_sheets` IN YOUR CODE (this is NOT a tool argument — it's a global your code sets) and pass `write_to_spreadsheet` AS A TOOL ARG. Example code:

    ```python
    import pandas as pd
    p = pd.DataFrame(products)
    s = pd.DataFrame(sales)
    enriched = s.merge(p, on='product_id', how='left')
    output_sheets = {
        'Ventas Enriquecidas': enriched,
        'Resumen por Categoría': enriched.groupby('category')['total'].sum().reset_index(),
        'Resumen por Región':    enriched.groupby('region')['total'].sum().reset_index(),
    }
    output = {'tabs_written': 3}
    ```

    The dispatcher creates one new tab per dict entry; the LLM receives only metadata `{name, resolved_name, sheet_id, n_rows, n_cols}` per tab, never row contents. Name collisions auto-suffix " (2)", " (3)".

    ## Output modes (replace / update_in_place / overwrite)

    Each entry in `output_sheets` can be either a bare DataFrame (mode
    defaults to `replace`) OR a spec dict:

    ```python
    # Mode 1 — replace (default; tab must not exist or policy applies)
    output_sheets = {'NewTab': df}

    # Mode 2 — update_in_place (patch specific cells, never overwrites a full tab)
    output_sheets = {
        'Sales': {
            'mode': 'update_in_place',
            'df': df_modified,
            'key': 'product_id',          # column identifying rows
            'columns': ['price'],         # optional — only patch these columns
        }
    }

    # Mode 3 — overwrite (replace existing tab; explicit consent)
    output_sheets = {'Sales': {'mode': 'overwrite', 'df': df}}
    ```

    **Collision policy.** By default, if a tab named in `output_sheets`
    already exists, the tool fails with a `SheetExists` error returning
    metadata (row/col count, columns) and three suggested next moves
    (rename, update_in_place, overwrite). Operators can opt back into
    silent auto-suffix by setting `fixed_config.on_existing_sheet:
    "auto_suffix"` on the tool config.

    ⚠️ For 47 row updates in a 1000-row tab, `update_in_place` is the
    correct choice — it writes only the 47 changed cells via a single
    batchUpdate, instead of replacing 12K cells.

    For more patterns and pitfalls, load the `gsheets-table-exploration` skill (single-table inspection) or `gsheets-cross-sheet-analysis` skill (joins, comparisons).

    MERGED CELLS: sheets are loaded with merged cells already forward-filled, so
    a column that was visually merged (e.g. a category spanning several rows)
    arrives fully populated — groupby/join/compare work directly, with no NaN
    gaps to fill yourself.

gsheets_list_spreadsheets:
  summary: Discover Google Spreadsheets visible to the OAuth user (agents@startti.co) — optionally filtered by name, folder, or modified-after date
  description: |
    Drive discovery for spreadsheets. Returns the spreadsheets the OAuth
    user can see (own + shared), in `modifiedTime desc` order, with
    pagination.

    All args are optional. An empty call returns the 20 most-recently-modified
    spreadsheets visible to the agent account.

    Args:
      - `query` (optional): substring filter against the spreadsheet name.
        Drive `name contains` semantics. Examples: "Inventario", "Q3 2026".
      - `parent_folder_id` (optional): restrict to a single Drive folder.
        Folder must contain the file as a direct child (no recursion).
      - `modified_after` (optional): RFC 3339 timestamp lower bound for
        `modifiedTime`. Example: "2026-06-01T00:00:00Z".
      - `limit` (optional): page size, default 20, max 100.
      - `page_token` (optional): cursor from a prior call to fetch the
        next page.

    Returns `{ok, spreadsheets: [{spreadsheet_id, name, url, modified_time, owners}], next_page_token}`.
    `next_page_token` is present only when more results are available.
    `owners` is a list of email addresses (may be empty for Shared Drive
    files where ownership belongs to the organization).

    Typical workflow:
      1. User: "buscame el inventario de productos y agregale los nuevos"
      2. LLM: gsheets_list_spreadsheets({query: "inventario"})
         → recibe {spreadsheets: [{spreadsheet_id: "1xyz", name: "Inventario Productos 2026"}]}
      3. LLM: gsheets_list_sheets({spreadsheet_id: "1xyz"})
         → recibe tabs available
      4. LLM continúa con set_range / batch_update_cells / etc.

    The agent account only sees files that have been shared with it OR are
    owned by it. To make a new spreadsheet visible to the agent, share it
    with the share email shown in the agent's catalog prelude.

gsheets_share:
  summary: Grant a Google account access to a spreadsheet (reader / commenter / writer)
  description: |
    Drive `permissions.create` for a spreadsheet. Adds a single grant.
    Drive emails the recipient unless your operator config disables
    notifications.

    Args:
      - `spreadsheet_id` (req): the Drive id of the spreadsheet.
      - `email` (req): the user / group address to grant access to.
      - `role` (req): one of `"reader"`, `"commenter"`, `"writer"`.

    Returns `{ok: true}`. Errors:
      - `permission_denied`: agent account is not the owner / lacks share rights.
      - `invalid_role`: role must be one of the three strings above.

    Typical workflow:
      1. User: "compartí el inventario con ana@cliente.com como editora"
      2. LLM: gsheets_list_spreadsheets({query: "inventario"})
         → recibe {spreadsheets: [{spreadsheet_id: "1xyz"}]}
      3. LLM: gsheets_share({spreadsheet_id: "1xyz", email: "ana@cliente.com", role: "writer"})
         → {ok: true}

    To revoke later: call `gsheets_unshare` with the `permission_id` from
    `gsheets_list_permissions`.

gsheets_list_permissions:
  summary: Show every Drive permission on a spreadsheet (who has access and at what role)
  description: |
    Drive `permissions.list`. Returns all grants on the spreadsheet — users,
    groups, domains, and `"anyone"` link-shared entries — so the LLM (and the
    user) can audit who can see / edit it.

    Args:
      - `spreadsheet_id` (req): the Drive id.

    Returns `{ok: true, permissions: [{permission_id, type, role, email?, display_name?}]}`.
    `permission_id` is Drive's stable id (NOT the email) — pass it to
    `gsheets_unshare` to revoke a specific grant.

    `email` and `display_name` are only present when Drive surfaces them
    (some org policies mask them, and `"anyone"` entries have neither).

    Use this BEFORE `gsheets_unshare` to pick the right `permission_id`.

gsheets_unshare:
  summary: Revoke a previously-granted permission on a spreadsheet
  description: |
    Drive `permissions.delete`. Removes a single grant by its Drive
    `permission_id`. Idempotent on the second call (Drive returns 404 →
    surfaced as `spreadsheet_not_found` with the permission id baked in).

    Args:
      - `spreadsheet_id` (req): the Drive id.
      - `permission_id` (req): Drive's stable id from `gsheets_list_permissions`.
        NOT the email — emails are not unique grants.

    Returns `{ok: true}` on success.

    Typical workflow:
      1. User: "sacale acceso a ana@cliente.com del inventario"
      2. LLM: gsheets_list_permissions({spreadsheet_id: "1xyz"})
         → recibe permissions con {permission_id: "perm123", email: "ana@cliente.com"}
      3. LLM: gsheets_unshare({spreadsheet_id: "1xyz", permission_id: "perm123"})
         → {ok: true}

    DO NOT confuse permission_id with email — Drive can have multiple
    grants for the same email (different roles via different grants); each
    has its own permission_id.

gsheets_format_range:
  summary: Apply cell formatting to one or more ranges
  description: Apply cell formatting (text, background, borders, alignment, number format, column width) to ranges via a single batchUpdate.
