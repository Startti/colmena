<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Documents CRDT Spike</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #toolbar { padding: 8px; background: #f0f0f0; border-bottom: 1px solid #ddd; }
    #univer { width: 100%; height: calc(100% - 50px); }
    code { background: #fff; padding: 2px 4px; }
  </style>
  <link rel="stylesheet"
    href="https://unpkg.com/@univerjs/design@0.2.10/lib/index.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/@univerjs/ui@0.2.10/lib/index.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/@univerjs/docs-ui@0.2.10/lib/index.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/@univerjs/sheets-ui@0.2.10/lib/index.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/@univerjs/sheets-formula@0.2.10/lib/index.css" />

  <!-- Import map: tell the browser how to resolve bare specifiers like "yjs".
       Required because y-websocket@1.5.4 is loaded with ?external=yjs, which
       makes esm.sh emit `import "yjs"` inside its bundle so y-websocket
       shares OUR yjs instance (instead of bundling its own copy). Without
       this map the browser throws:
         Failed to resolve module specifier "yjs"
       and the whole module aborts. -->
  <script type="importmap">
  {
    "imports": {
      "yjs": "https://esm.sh/yjs@13.6.18"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    Artifact: <code id="artifact">spike-doc</code>
    | WS: <code id="ws-status">connecting&hellip;</code>
    | Tab id: <code id="tab"></code>
    | <button id="import-xlsx" type="button" disabled>Import /spike.xlsx</button>
  </div>
  <div id="univer"></div>

  <script type="module">
    import * as Y from "yjs";
    import { WebsocketProvider } from "https://esm.sh/y-websocket@1.5.4?external=yjs";

    const artifact = new URLSearchParams(location.search).get("artifact")
      || "spike-doc";
    document.getElementById("artifact").textContent = artifact;
    document.getElementById("tab").textContent =
      Math.random().toString(36).slice(2, 8);

    const wsBase = location.host;
    const ydoc = new Y.Doc();
    const provider = new WebsocketProvider(
      `ws://${wsBase}/yjs`, artifact, ydoc, { params: {} });
    provider.on("status", e => {
      document.getElementById("ws-status").textContent = e.status;
    });

    // -------------------------------------------------------------------------
    // Y.Doc workbook structure
    //
    //   ydoc.getMap("workbook")
    //     .get("sheets")       -> Y.Array of Y.Map entries
    //       [0].get("id")      -> string
    //       [0].get("name")    -> string
    //       [0].get("cells")   -> Y.Map<addr, Y.Map<"v", value>>
    //
    // Bridge Univer <-> Y.Doc:
    //   Outbound: on Univer cell-mutation commands, write changed cells into
    //             ydoc.getMap("workbook").get("sheets")[i].get("cells").
    //   Inbound:  on Y.Doc cell-map observe events, apply back to Univer via
    //             the command bus.
    //
    // For R1.2 measurement we need at minimum: a POST to /spike/agent-op
    // shows up as a cell change in the inbound observer (logged to DevTools
    // console), proving the WS round-trip works without a Univer collab backend.
    // The outbound bridge (Univer -> Y.Doc) is intentionally stubbed here
    // pending command-id discovery in DevTools at first live run.
    // -------------------------------------------------------------------------
    //
    // NOTE: we do NOT seed the Y.Doc here. Seeding before `provider.sync`
    // races with the server's state: if the server already has a sheet and
    // we push a duplicate locally before sync arrives, the merged Y.Array
    // ends up with two sheets and Univer's initial state becomes
    // unpredictable (sometimes our sheet, sometimes the server's, sometimes
    // an inconsistent split). The grid then renders flakily — sometimes OK,
    // sometimes blank.
    //
    // All Y.Doc bootstrap (ensure-sheets-array, seed-empty-sheet, attach
    // observers) is deferred to the `provider.once("sync", ...)` callback
    // below, after Univer is mounted with a STATIC empty workbook.

    const wb = ydoc.getMap("workbook");

    // -------------------------------------------------------------------------
    // Univer bootstrap
    //
    // R1.2 test: Univer loaded WITHOUT @univerjs/collaboration-client.
    // The collaboration-client normally negotiates a Univer-specific handshake
    // with a Univer backend.  We deliberately omit it and wire only plain
    // y-websocket.  If Univer pulls the collab client transitively and tries
    // that handshake anyway, the operator records R1.2 = NO-GO.
    //
    // Note: In Univer 0.2.x, `createUniver` was removed from @univerjs/core.
    // The correct API is `new Univer({...})` + `univer.registerPlugin(...)`.
    // -------------------------------------------------------------------------
    import { Univer, LocaleType, ICommandService, IUniverInstanceService } from
      "https://esm.sh/@univerjs/core@0.2.10";
    import { defaultTheme } from
      "https://esm.sh/@univerjs/design@0.2.10";

    // Locale dictionaries — required by LocaleService in Univer 0.2.x.
    // Each plugin ships its own locale keys; we merge them into one dict.
    // Loaded via fetch() instead of import-assert (deprecated syntax, not supported in all browsers).
    const enUSLocale = await (async () => {
      const [sheetsUI, ui, docsUI, sheetsFormula] = await Promise.all([
        fetch("https://esm.sh/@univerjs/sheets-ui@0.2.10/lib/locale/en-US.json").then(r => r.json()),
        fetch("https://esm.sh/@univerjs/ui@0.2.10/lib/locale/en-US.json").then(r => r.json()),
        fetch("https://esm.sh/@univerjs/docs-ui@0.2.10/lib/locale/en-US.json").then(r => r.json()),
        fetch("https://esm.sh/@univerjs/sheets-formula@0.2.10/lib/locale/en-US.json").then(r => r.json()),
      ]);
      return { ...sheetsUI, ...ui, ...docsUI, ...sheetsFormula };
    })();
    import { UniverDocsPlugin } from
      "https://esm.sh/@univerjs/docs@0.2.10";
    import { UniverDocsUIPlugin } from
      "https://esm.sh/@univerjs/docs-ui@0.2.10";
    import { UniverFormulaEnginePlugin } from
      "https://esm.sh/@univerjs/engine-formula@0.2.10";
    import { UniverRenderEnginePlugin } from
      "https://esm.sh/@univerjs/engine-render@0.2.10";
    import { UniverSheetsPlugin } from
      "https://esm.sh/@univerjs/sheets@0.2.10";
    import { UniverSheetsFormulaPlugin } from
      "https://esm.sh/@univerjs/sheets-formula@0.2.10";
    import { UniverSheetsUIPlugin } from
      "https://esm.sh/@univerjs/sheets-ui@0.2.10";
    import { UniverUIPlugin } from
      "https://esm.sh/@univerjs/ui@0.2.10";

    const univer = new Univer({
      theme: defaultTheme,
      locale: LocaleType.EN_US,
      locales: {
        [LocaleType.EN_US]: enUSLocale,
      },
    });
    univer.registerPlugin(UniverRenderEnginePlugin);
    univer.registerPlugin(UniverFormulaEnginePlugin);
    univer.registerPlugin(UniverUIPlugin, { container: "univer" });
    univer.registerPlugin(UniverDocsPlugin);
    univer.registerPlugin(UniverDocsUIPlugin);
    univer.registerPlugin(UniverSheetsPlugin);
    univer.registerPlugin(UniverSheetsUIPlugin);
    univer.registerPlugin(UniverSheetsFormulaPlugin);

    // Bootstrap Univer with a STATIC empty workbook. We deliberately do NOT
    // read from the Y.Doc here — the Y.Doc is not yet synced with the
    // server at this point in the script, and reading pre-sync state caused
    // the flaky-grid bug (race between local seed and server sync).
    const initialState = {
      id: artifact,
      sheetOrder: ["s1"],
      sheets: {
        s1: {
          id: "s1",
          name: "Hoja1",
          cellData: {},
          rowCount: 100,
          columnCount: 26,
        },
      },
    };

    // UniverInstanceType.UNIVER_SHEET = 2
    univer.createUnit(2, initialState);

    // -------------------------------------------------------------------------
    // Y.Doc bootstrap — DEFERRED until provider sync completes.
    // Command IDs discovered from @univerjs/sheets@0.2.10 CJS bundle
    // inspection on unpkg.com.
    // -------------------------------------------------------------------------
    // -------------------------------------------------------------------------
    // Command / mutation IDs — discovered from @univerjs/sheets@0.2.10 CJS
    // bundle inspection (unpkg.com).  The mutation fires on every state change
    // (including those triggered by the higher-level command), so it is the
    // correct level to listen at for the outbound bridge.  We dispatch the
    // same mutation from the inbound bridge so we don't create undo entries.
    // -------------------------------------------------------------------------
    const SET_RANGE_VALUES_MUTATION_ID = "sheet.mutation.set-range-values";

    // -------------------------------------------------------------------------
    // Helper: zero-based column index → A1-style column letter(s)
    //   0 → "A", 1 → "B", ..., 25 → "Z", 26 → "AA", ...
    // -------------------------------------------------------------------------
    function colNumberToA1(col) {
      let s = "";
      let n = col;
      do {
        s = String.fromCharCode(65 + (n % 26)) + s;
        n = Math.floor(n / 26) - 1;
      } while (n >= 0);
      return s;
    }

    // -------------------------------------------------------------------------
    // Feedback-loop guard
    //
    // When the inbound bridge (Y.Doc → Univer) dispatches a mutation, Univer's
    // command bus fires onCommandExecuted, which would re-trigger the outbound
    // bridge (Univer → Y.Doc) and create an infinite loop.
    //
    // We suppress this by setting `applyingFromYDoc = true` around every
    // inbound dispatch.  The outbound subscriber is a no-op while this flag is
    // set.  The flag is synchronously reset in the `finally` block so normal
    // user edits are never silenced.
    // -------------------------------------------------------------------------
    let applyingFromYDoc = false;

    provider.once("sync", () => {
      console.log("[provider] sync complete — bootstrapping Y.Doc workbook");

      if (!wb.has("sheets")) {
        wb.set("sheets", new Y.Array());
      }
      const sheetsArr = wb.get("sheets");

      if (sheetsArr.length === 0) {
        ydoc.transact(() => {
          const sheet = new Y.Map();
          sheet.set("id", "s1");
          sheet.set("name", "Hoja1");
          sheet.set("cells", new Y.Map());
          sheetsArr.push([sheet]);
        });
        console.log("[provider] seeded empty sheet s1");
      } else {
        console.log("[provider] using existing sheets from server",
          sheetsArr.length);
      }

      // Retrieve services from Univer's DI container.
      // ICommandService  = createIdentifier("anywhere.command-service")
      // IUniverInstanceService = createIdentifier("univer.current")
      // Both are exported as value + type from @univerjs/core and work as DI
      // keys when passed to injector.get().
      const injector = univer.__getInjector();
      const commandService = injector.get(ICommandService);
      const instanceService = injector.get(IUniverInstanceService);

      // -----------------------------------------------------------------
      // Inbound bridge: Y.Doc → Univer
      //
      // observeDeep on the first sheet's cells Y.Map.  When remote peers
      // (agent-op POST, another tab, spike-agent ws) write cells, we
      // translate the delta into a SetRangeValuesMutation payload and
      // dispatch it synchronously so Univer re-renders the affected cells.
      //
      // We use observeDeep (vs observe) so nested Y.Map mutations (e.g.
      // setting the "v" key on an existing cellMap) also fire here.
      // -----------------------------------------------------------------
      const cellsMap = sheetsArr.get(0).get("cells");

      cellsMap.observeDeep(events => {
        const cellValue = {};
        for (const ev of events) {
          // We only care about key-level changes on Y.Map nodes.
          if (!(ev instanceof Y.YMapEvent)) continue;
          for (const [key, change] of ev.changes.keys.entries()) {
            if (change.action === "delete") continue;

            // Determine the cell address.  Two cases:
            //   1. A new cellMap was set on the top-level cells Y.Map
            //      (ev.target === cellsMap, key = "A1" etc.).
            //   2. A value was set inside an existing cellMap
            //      (ev.target is a child Y.Map, key = "v" / "t").
            let addr;
            if (ev.target === cellsMap) {
              // Case 1: the key IS the address.
              addr = key;
            } else {
              // Case 2: find which address this child Y.Map lives under.
              addr = null;
              for (const [a, m] of cellsMap.entries()) {
                if (m === ev.target) { addr = a; break; }
              }
            }
            if (!addr) continue;

            const cellMap = cellsMap.get(addr);
            if (!cellMap) continue;

            // Parse addr "A1" → { row: 0, col: 0 }
            // Column letters may be multi-char (AA, AB …).
            const match = addr.match(/^([A-Z]+)(\d+)$/);
            if (!match) continue;
            const colLetters = match[1];
            const rowIdx = parseInt(match[2], 10) - 1;
            let colIdx = 0;
            for (let i = 0; i < colLetters.length; i++) {
              colIdx = colIdx * 26 + (colLetters.charCodeAt(i) - 64);
            }
            colIdx -= 1; // convert to 0-based

            cellValue[rowIdx] = cellValue[rowIdx] || {};
            cellValue[rowIdx][colIdx] = { v: cellMap.get("v") };
          }
        }
        if (Object.keys(cellValue).length === 0) return;

        // Get active unit + sheet ids.
        // UniverInstanceType.UNIVER_SHEET = 2 (confirmed from bundle).
        const workbook = instanceService.getCurrentUnitForType(2);
        if (!workbook) {
          console.warn("[yjs -> univer] no active workbook; skipping");
          return;
        }
        const unitId = workbook.getUnitId();
        const subUnitId = workbook.getActiveSheet().getSheetId();

        console.log("[yjs -> univer] applying to canvas", { cellValue, unitId, subUnitId });

        applyingFromYDoc = true;
        try {
          // Dispatch the mutation directly (not the command) so we bypass
          // the undo stack.  syncExecuteCommand keeps us on the same tick.
          commandService.syncExecuteCommand(SET_RANGE_VALUES_MUTATION_ID, {
            unitId,
            subUnitId,
            cellValue,
          });
        } finally {
          applyingFromYDoc = false;
        }
      });

      // -----------------------------------------------------------------
      // Initial render replay (R1.1 — mid-session tab join)
      //
      // observeDeep only fires on NEW changes after the observer attaches.
      // When a tab joins an artifact that already has cells (written by
      // earlier tabs or the agent), the canvas stays empty for those existing
      // cells — only updates that arrive after the join are rendered.
      //
      // Fix: walk the current cells Y.Map once and dispatch a single
      // SetRangeValues mutation so the canvas catches up to the current
      // Y.Doc state.  Uses the same applyingFromYDoc guard as the observer.
      // -----------------------------------------------------------------
      if (cellsMap.size > 0) {
        const replayCellValue = {};
        for (const [addr, cellMap] of cellsMap.entries()) {
          if (!(cellMap instanceof Y.Map)) continue;
          const match = addr.match(/^([A-Z]+)(\d+)$/);
          if (!match) continue;
          const colLetters = match[1];
          const rowIdx = parseInt(match[2], 10) - 1;
          let colIdx = 0;
          for (let i = 0; i < colLetters.length; i++) {
            colIdx = colIdx * 26 + (colLetters.charCodeAt(i) - 64);
          }
          colIdx -= 1; // convert to 0-based
          replayCellValue[rowIdx] = replayCellValue[rowIdx] || {};
          replayCellValue[rowIdx][colIdx] = { v: cellMap.get("v") };
        }
        if (Object.keys(replayCellValue).length > 0) {
          const workbook = instanceService.getCurrentUnitForType(2);
          if (workbook) {
            const unitId = workbook.getUnitId();
            const subUnitId = workbook.getActiveSheet().getSheetId();
            applyingFromYDoc = true;
            try {
              commandService.syncExecuteCommand(SET_RANGE_VALUES_MUTATION_ID, {
                unitId,
                subUnitId,
                cellValue: replayCellValue,
              });
            } finally {
              applyingFromYDoc = false;
            }
            console.log("[initial render] replayed", Object.keys(replayCellValue).length, "rows of existing cells");
          }
        }
      }

      // -----------------------------------------------------------------
      // Outbound bridge: Univer → Y.Doc
      //
      // Subscribe to the command bus.  Every time a SetRangeValues mutation
      // fires (from ANY source — keyboard, paste, formula evaluation, etc.)
      // we translate the changed cells into Y.Doc writes.
      //
      // The feedback-loop guard `applyingFromYDoc` ensures that mutations
      // dispatched by our own inbound bridge are silently ignored here.
      // -----------------------------------------------------------------
      commandService.onCommandExecuted((cmd) => {
        if (applyingFromYDoc) return;
        if (cmd.id !== SET_RANGE_VALUES_MUTATION_ID) return;

        const params = cmd.params;
        if (!params || !params.cellValue) return;

        ydoc.transact(() => {
          for (const [rowStr, cols] of Object.entries(params.cellValue)) {
            const row = Number(rowStr);
            for (const [colStr, cellPayload] of Object.entries(cols)) {
              const col = Number(colStr);
              const addr = colNumberToA1(col) + String(row + 1);
              const v = cellPayload?.v ?? null;

              let cellMap = cellsMap.get(addr);
              if (!cellMap) {
                cellMap = new Y.Map();
                cellsMap.set(addr, cellMap);
              }
              cellMap.set("v", v);
              cellMap.set("t", typeof v === "number" ? "n"
                          : typeof v === "boolean" ? "b" : "s");
            }
          }
        });

        console.log("[univer -> yjs] cells written", { cellValue: params.cellValue });
      });

      // -----------------------------------------------------------------
      // xlsx import button (R5.1 + R5.2)
      //
      // Enabled after sync so sheetsArr is valid.  On click: fetch
      // /spike.xlsx, parse with SheetJS, write each non-empty cell into
      // the Y.Doc cells Y.Map inside a single ydoc.transact.  The writes
      // propagate via WS to all peers AND the server's Y.Doc.  The local
      // inbound observer fires and dispatches SetRangeValues → canvas
      // updates.  Other tabs' observers also fire → convergence.
      // -----------------------------------------------------------------
      const importBtn = document.getElementById("import-xlsx");
      importBtn.disabled = false;
      importBtn.addEventListener("click", async () => {
        importBtn.disabled = true;
        importBtn.textContent = "Importing…";
        try {
          const XLSX = await import("https://esm.sh/xlsx@0.18.5");
          const resp = await fetch("/spike.xlsx");
          if (!resp.ok) throw new Error("fetch /spike.xlsx: HTTP " + resp.status);
          const buf = await resp.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array" });
          const firstSheetName = wb.SheetNames[0];
          const ws = wb.Sheets[firstSheetName];

          // Walk the sheet's !ref range and write each non-empty cell to Y.Doc.
          const range = XLSX.utils.decode_range(ws["!ref"] || "A1:A1");
          let count = 0;
          ydoc.transact(() => {
            for (let R = range.s.r; R <= range.e.r; ++R) {
              for (let C = range.s.c; C <= range.e.c; ++C) {
                const addr = XLSX.utils.encode_cell({ r: R, c: C });
                const cell = ws[addr];
                if (!cell) continue;
                // Use the cached calculated value (cell.v); skip if absent.
                const v = cell.v;
                if (v === undefined || v === null) continue;
                let cellMap = cellsMap.get(addr);
                if (!cellMap) {
                  cellMap = new Y.Map();
                  cellsMap.set(addr, cellMap);
                }
                cellMap.set("v", v);
                cellMap.set("t",
                  typeof v === "number" ? "n" :
                  typeof v === "boolean" ? "b" : "s");
                count++;
              }
            }
          });
          importBtn.textContent = `Imported ${count} cells ✓`;
          console.log("[xlsx import]", count, "cells written to Y.Doc");
        } catch (e) {
          importBtn.textContent = "Import failed";
          console.error("[xlsx import] failed:", e);
          importBtn.disabled = false;
        }
      });

      // Expose for DevTools inspection.
      window.spikeSheets = sheetsArr;
    });

    window.univer = univer; // Expose for DevTools inspection
  </script>
</body>
</html>
