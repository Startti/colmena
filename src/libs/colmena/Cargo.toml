[package]
name = "colmena_dag_engine"
version = "0.3.0"
edition = "2021"

[lib]
name = "colmena"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "colmena"
path = "src/main.rs"

[[bin]]
name = "dag_engine"
path = "src/dag_engine/main.rs"

[[example]]
name = "gcs_spike"
path = "examples/gcs_spike.rs"
required-features = ["gcs"]

[dependencies]
# clap
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Python bindings
pyo3 = { version = "0.21.2", features = ["macros"] }
pyo3-asyncio-0-21 = { version = "0.21.0", features = ["tokio-runtime"], optional = true }
pythonize = "0.21"

# Node bindings (napi-rs)
napi = { version = "2.16.14", default-features = false, features = ["napi4", "tokio_rt", "async", "serde-json"], optional = true }
napi-derive = { version = "2.16.12", optional = true }

# Streaming
futures = "0.3"
tokio-stream = { version = "0.1", features = ["io-util"] }

# Environment variables
dotenvy = "0.15"
bytes = "1.0"

# --- NEW FOR MILESTONE 2 ---
# Web Framework
axum = "0.7"
# Tracing/Logging (Optional but recommended for servers)
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlparser = "0.62"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "macros"] }
async-stream = "0.3.6"
base64 = "0.22.1"

# Template resolution
regex = "1.10"
once_cell = "1"

# Shared connection-pool registry (see docs/superpowers/specs/2026-04-20-connection-pool-management-design.md)
dashmap = "6"
lru = "0.12"
sha2 = "0.10"

# Skills: YAML frontmatter + compile-in built-in skills
serde_yaml = "0.9"

# OpenAPI 3.x parsing (api_explorer node, Spec C).
oas3 = { version = "0.21", features = ["yaml-spec"] }

# Unicode-aware fuzzy matcher (used by Helix editor) — endpoint search.
nucleo-matcher = "0.3"

include_dir = "0.7"

# Documents feature
pdf-extract = "0.7"
rust_xlsxwriter = "0.77"
docx-rs = "0.4"
schemars = { version = "0.8", features = ["chrono", "uuid1", "preserve_order"] }
ulid = "1"

# Documents feature — GCS backend (optional, gated on `gcs` feature)
google-cloud-storage = { version = "1", optional = true }

# Socket.IO client
rust_socketio = { version = "0.6", features = ["async"] }

# Google service account auth — used by image_generation node when calling
# Vertex AI Imagen. Exchanges a service-account JSON for a short-lived bearer
# token (caches inside the Authenticator). Reads service account from the
# standard `GOOGLE_APPLICATION_CREDENTIALS` env var.
yup-oauth2 = "11"

[features]
default = []
python = ["pyo3-asyncio-0-21"]
node = ["napi", "napi-derive", "napi-build"]
gcs = ["dep:google-cloud-storage"]

[build-dependencies]
napi-build = { version = "2.1.3", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
mockall = "0.11"
wiremock = "0.6"
serde_json = { version = "1.0", features = ["preserve_order"] }
derivative = "2.2"
tempfile = "3.10"
serial_test = "3"
calamine = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Treat all warnings as errors for this crate so local builds match CI strictness.
# Scoped to our crate only (does not affect dependencies).
[lints.rust]
warnings = "deny"


