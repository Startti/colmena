[package]
name = "colmena_dag_engine"
version = "0.4.0"
edition = "2021"

[lib]
name = "colmena"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "colmena"
path = "src/main.rs"

[[bin]]
name = "dag_engine"
path = "src/dag_engine/main.rs"

[[bin]]
name = "attachment_gc"
path = "src/attachment_gc/main.rs"

[[bin]]
name = "colmena_oauth_setup"
path = "src/bin/colmena_oauth_setup.rs"

[[example]]
name = "gcs_spike"
path = "examples/gcs_spike.rs"
required-features = ["gcs"]

[dependencies]
# clap
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Formula engine (D-T1 spike onwards)
formualizer = "0.6"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Python bindings
pyo3 = { version = "0.29", features = ["macros"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }
pythonize = "0.29"

# Node bindings (napi-rs)
napi = { version = "2.16.14", default-features = false, features = ["napi4", "tokio_rt", "async", "serde-json"], optional = true }
napi-derive = { version = "2.16.12", optional = true }

# Streaming
futures = "0.3"
tokio-stream = { version = "0.1", features = ["io-util"] }
# Cooperative cancellation (CancellationToken) for hard-stop / graph cancellation
tokio-util = "0.7"

# Environment variables
dotenvy = "0.15"
bytes = "1.0"

# --- NEW FOR MILESTONE 2 ---
# Web Framework
axum = { version = "0.7", features = ["ws"] }
yrs = { version = "0.26", features = ["sync"] }
y-sync = "0.4"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Tracing/Logging (Optional but recommended for servers)
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlparser = { version = "0.62", features = ["visitor"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "any", "uuid", "chrono", "macros", "bigdecimal"] }
bigdecimal = "0.4"
async-stream = "0.3.6"
base64 = "0.22.1"

# Template resolution
regex = "1.10"
once_cell = "1"

# Shared connection-pool registry (see docs/superpowers/specs/2026-04-20-connection-pool-management-design.md)
dashmap = "6"
lru = "0.12"
sha2 = "0.10"

# Skills: YAML frontmatter + compile-in built-in skills
serde_yaml = "0.9"

# OpenAPI 3.x parsing (api_explorer node, Spec C).
oas3 = { version = "0.21", features = ["yaml-spec"] }

# Unicode-aware fuzzy matcher (used by Helix editor) — endpoint search.
nucleo-matcher = "0.3"

include_dir = "0.7"

# Documents feature
pdf-extract = "0.7"
rust_xlsxwriter = "0.77"
docx-rs = "0.4"
calamine = "0.24"

# Streaming CSV reader (sql_inspect_attachment + sql_bulk_insert_from_attachment).
csv = "1.3"

# One-time OAuth consent CLI utility (`colmena_oauth_setup` binary). Tiny dep
# (~30 KB), only pulled in for the binary target — the lib itself does not use it.
webbrowser = "1"
schemars = { version = "0.8", features = ["chrono", "uuid1", "preserve_order"] }
ulid = "1"
maud = "0.26"

parking_lot = "0.12"

# Documents feature — GCS backend (optional, gated on `gcs` feature)
google-cloud-storage = { version = "1", optional = true }

# Socket.IO client
rust_socketio = { version = "0.6", features = ["async"] }

# Google service account auth — used by image_generation node when calling
# Vertex AI Imagen. Exchanges a service-account JSON for a short-lived bearer
# token (caches inside the Authenticator). Reads service account from the
# standard `GOOGLE_APPLICATION_CREDENTIALS` env var.
yup-oauth2 = "11"

# URL percent-encoding for Sheets API range params (Sheet1!A1:B2 → Sheet1%21A1%3AB2).
urlencoding = "2"

# Text diffing (gdocs co-edit guard — paragraph-level diff).
similar = "2"

# Markdown parsing (gdocs markdown → batchUpdate ops converter).
pulldown-cmark = { version = "0.10", default-features = false }

# RFC822/MIME parsing (imap_read node — raw bytes → headers/body/attachments).
mail-parser = "0.11"

[features]
default = []
python = ["pyo3-async-runtimes"]
node = ["napi", "napi-derive", "napi-build"]
gcs = ["dep:google-cloud-storage"]

[build-dependencies]
napi-build = { version = "2.1.3", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
mockall = "0.11"
wiremock = "0.6"
serde_json = { version = "1.0", features = ["preserve_order"] }
derivative = "2.2"
tempfile = "3.10"
serial_test = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }

# Treat all warnings as errors for this crate so local builds match CI strictness.
# Scoped to our crate only (does not affect dependencies).
[lints.rust]
warnings = "deny"


