[package]
name = "colmena_dag_engine"
version = "0.3.0"
edition = "2021"

[lib]
name = "colmena"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "colmena"
path = "src/main.rs"

[[bin]]
name = "dag_engine"
path = "src/dag_engine/main.rs"

[dependencies]
# clap
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Python bindings
pyo3 = { version = "0.21.2", features = ["macros"] }
pyo3-asyncio-0-21 = { version = "0.21.0", features = ["tokio-runtime"], optional = true }
pythonize = "0.21"

# Node bindings (napi-rs)
napi = { version = "2.16.14", default-features = false, features = ["napi4", "tokio_rt", "async", "serde-json"], optional = true }
napi-derive = { version = "2.16.12", optional = true }

# Streaming
futures = "0.3"
tokio-stream = { version = "0.1", features = ["io-util"] }

# Environment variables
dotenvy = "0.15"
bytes = "1.0"

# --- NEW FOR MILESTONE 2 ---
# Web Framework
axum = "0.7"
# Tracing/Logging (Optional but recommended for servers)
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "macros"] }
async-stream = "0.3.6"
base64 = "0.22.1"

# Template resolution
regex = "1.10"

# Socket.IO client
rust_socketio = { version = "0.6", features = ["async"] }

[features]
default = []
python = ["pyo3-asyncio-0-21"]
node = ["napi", "napi-derive", "napi-build"]

[build-dependencies]
napi-build = { version = "2.1.3", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
mockall = "0.11"
wiremock = "0.5"
serde_json = { version = "1.0", features = ["preserve_order"] }
derivative = "2.2"


