openapi: 3.0.3
info:
  title: Swagger Petstore
  description: A minimal petstore used by api_explorer tests.
  version: "1.0.0"
servers:
  - url: https://petstore3.swagger.io/api/v3
tags:
  - name: pet
  - name: store
paths:
  /pet:
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        description: Pet object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
      security:
        - BearerAuth: []
    get:
      tags: [pet]
      summary: List pets
      operationId: listPets
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pet/{petId}:
    get:
      tags: [pet]
      summary: Get pet by ID
      operationId: getPetById
      parameters:
        - in: path
          name: petId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: not found
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [available, pending, sold]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
