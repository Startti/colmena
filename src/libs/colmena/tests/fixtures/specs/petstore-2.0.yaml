swagger: "2.0"
info:
  title: Swagger Petstore 2.0
  version: "1.0.0"
host: petstore.swagger.io
basePath: /v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /pet:
    post:
      operationId: addPet
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '200':
          description: ok
          schema:
            $ref: '#/definitions/Pet'
      security:
        - ApiKeyAuth: []
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - in: path
          name: petId
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: ok
          schema:
            $ref: '#/definitions/Pet'
definitions:
  Pet:
    type: object
    required:
      - name
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    name: X-API-Key
    in: header
